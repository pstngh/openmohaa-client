name: "Publish Release"

on:
  push:
    tags:
        - "v*.*.*"

env:
  RELEASE_STAGE: ${{ vars.RELEASE_STAGE || 'unstable' }}
  RELEASE_IS_PRERELEASE: ${{ vars.RELEASE_IS_PRELEASE }}

permissions:
  contents: write

jobs:
  build-all:
   uses: ./.github/workflows/shared-build.yml
   with:
      environment: "release"

  release:
    runs-on: ubuntu-24.04
    environment: 'release'
    needs: [build-all]

    env:
      RELEASE_PREFIX: ${{ github.event.repository.name }}-${{github.ref_name}}

    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: 'out-*'
        path: ${{github.workspace}}/artifacts

    # Zip every platform build; Windows installer artifacts ship as their .msi
    - name: Package
      working-directory: ${{github.workspace}}/artifacts
      run: |
        for dir in out-*; do
          name="${{env.RELEASE_PREFIX}}-${dir#out-}"
          if [ -f "$dir/Setup.msi" ]; then
            cp "$dir/Setup.msi" "../${name%-installer}.msi"
          else
            (cd "$dir" && zip -9 -r "../../$name.zip" ./)
          fi
        done

    - name: Release
      uses: softprops/action-gh-release@v2.3.2
      with:
        name: '${{github.ref_name}}-${{env.RELEASE_STAGE}}'
        prerelease: ${{env.RELEASE_IS_PRERELEASE}}
        files: |
          ${{github.workspace}}/*.zip
          ${{github.workspace}}/*.msi
