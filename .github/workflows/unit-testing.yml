name: "Unit Tests"

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Running unit tests"
    runs-on: ubuntu-latest
    environment: "testing"

    steps:
    - uses: actions/checkout@v4

    # The runner image provides python3 and the c++ compiler the tests use
    - name: Test
      run: |
        find code -path '*/tests/test_*.py' -print | sort |
          while IFS= read -r test_file; do
            python3 "$test_file"
          done
