name: "Builds"

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-all:
   uses: ./.github/workflows/shared-build.yml
   with:
      environment: 'testing'

  release:
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-24.04
    environment: 'testing'
    needs: [build-all]

    env:
      RELEASE_PREFIX: ${{github.event.repository.name}}-dev

    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: 'out-*'
        path: ${{github.workspace}}/artifacts

    # Zip every platform build; Windows installer artifacts ship as their .msi
    - name: Package
      working-directory: ${{github.workspace}}/artifacts
      run: |
        for dir in out-*; do
          name="${{env.RELEASE_PREFIX}}-${dir#out-}"
          if [ -f "$dir/Setup.msi" ]; then
            cp "$dir/Setup.msi" "../${name%-installer}.msi"
          else
            (cd "$dir" && zip -9 -r "../../$name.zip" ./)
          fi
        done

    - name: Release
      uses: softprops/action-gh-release@v2.3.2
      with:
        prerelease: true
        name: '${{github.ref_name}}-${{github.sha}}'
        tag_name: 'dev'
        files: |
          ${{github.workspace}}/*.zip
          ${{github.workspace}}/*.msi
